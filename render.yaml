services:
  - type: web
    name: hexgate
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SESSION_DIR
        value: /var/data/sessions
      - key: API_KEY
        generateValue: true
    disk:
      name: hexgate-sessions
      mountPath: /var/data
      sizeGB: 1
